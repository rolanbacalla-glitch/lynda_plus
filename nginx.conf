server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy Firebase Auth handler so Google Sign-In uses lynda.rolanbacalla.online
    location /__/auth/ {
        proxy_pass https://gen-lang-client-0445571999.firebaseapp.com/__/auth/;
        proxy_ssl_server_name on;
        proxy_set_header Host gen-lang-client-0445571999.firebaseapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /__/firebase/ {
        proxy_pass https://gen-lang-client-0445571999.firebaseapp.com/__/firebase/;
        proxy_ssl_server_name on;
        proxy_set_header Host gen-lang-client-0445571999.firebaseapp.com;
    }

    # SPA fallback for React Router routes (/login, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
